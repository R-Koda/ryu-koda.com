name: Weekly Blog Post Generator

on:
  schedule:
    # 毎週月曜 09:00 JST。承認後に週1本公開（自動公開しない）
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手動実行も可能

concurrency:
  group: weekly-editorial
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Collect pending drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "BLOG_PENDING_BRANCHES=$(gh pr list --state open --limit 100 --json headRefName --jq '[.[].headRefName] | join(" ")')" >> "$GITHUB_ENV"

      - name: Generate blog post
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'blog: add new post - ${{ steps.generate.outputs.title }}'
          branch: blog/auto-${{ steps.generate.outputs.slug }}
          title: '📝 新記事ドラフト: ${{ steps.generate.outputs.title }}'
          body: |
            ## 自動生成された記事ドラフト

            **タイトル:** ${{ steps.generate.outputs.title }}
            **ファイル:** `${{ steps.generate.outputs.filename }}`

            ### 確認事項
            - [ ] 公式出典と本文の主張を照合した
            - [ ] 実際の操作・実機検証と未検証事項を区別した
            - [ ] 価格・対応OS・型番・確認日を照合した
            - [ ] タイトルは適切か
            - [ ] 内容に誤りがないか
            - [ ] 読みやすさは問題ないか
            - [ ] 画像の追加が必要か

            下書きはサイトから隔離されています。このPRをマージしただけでは公開されません。
            ユーザー承認後、未確認点を解消して本文をsrc/content/blogへ移してください。

            ---
            🤖 このPRは [Weekly Blog Generator](.github/workflows/weekly-blog.yml) により自動生成されました。
          delete-branch: true
          reviewers: R-Koda

      - name: Preserve draft artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-drafts
          path: editorial/drafts/
          if-no-files-found: ignore
