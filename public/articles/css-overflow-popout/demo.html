<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>切れる例と直した例の比較</title><meta name="robots" content="noindex,follow"><meta name="description" content="角丸カードの切り抜きと飛び出す飾りを比較する記事のサンプル。"><link rel="canonical" href="https://ryu-koda.com/articles/css-overflow-popout/demo.html"><meta property="og:url" content="https://ryu-koda.com/articles/css-overflow-popout/demo.html"><style>
*{box-sizing:border-box}body{margin:0;padding:26px;background:#f7f7f2;color:#293b36;font:16px/1.7 sans-serif}h1{font-size:24px;margin:0 0 8px}label{display:inline-block;margin:8px 14px 8px 0;cursor:pointer}input{accent-color:#23644e;width:18px;height:18px;vertical-align:middle}.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:18px}.sample{min-width:0}h2{font-size:18px;margin:0 0 52px}.card{position:relative;border-radius:24px;background:#fff;overflow:visible;box-shadow:0 4px 0 #d6ddd6}.bad{overflow:hidden}.card-face{border-radius:24px;overflow:hidden}.banner{height:100px;background:repeating-linear-gradient(135deg,#e0eee7 0 18px,#c6dfd1 18px 36px)}.copy{padding:22px}.copy p{margin:0}.mascot{position:absolute;right:24px;top:12px;z-index:1;width:64px;height:64px;display:grid;place-items:center;border:2px solid #293b36;border-radius:50%;background:#ffe49c;font-size:28px;pointer-events:none;transition:transform .35s ease}.card:hover .mascot,.card:focus-within .mascot,#pop:checked~.grid .mascot{transform:translateY(-44px) rotate(-8deg)}#high:checked~.grid .bad .mascot{z-index:999999}a{color:#23644e}small{display:block;margin-top:20px}code{overflow-wrap:anywhere}@media(max-width:560px){body{padding:18px}.grid{grid-template-columns:1fr;gap:30px}}@media(prefers-reduced-motion:reduce){.mascot{transition:none}}
</style><h1>顔が切れる？　箱を分けて比べよう。</h1><p>チェックで状態を固定できます。スマホでも操作できます。</p>
<input type="checkbox" id="pop" checked><label for="pop">飛び出した状態を固定</label>
<input type="checkbox" id="high"><label for="high">修正前のz-indexを999999にする</label>
<div class="grid">
<section class="sample"><h2>修正前：全体を切り抜く</h2><div class="card bad"><div class="card-face"><div class="banner"></div><div class="copy"><p>角丸はきれい。でも顔の上半分が切れる。</p><a href="#explanation">仕組みを見る</a></div></div><span class="mascot" aria-hidden="true">•ᴗ•</span></div><small><code>.card { overflow: hidden; }</code></small></section>
<section class="sample"><h2>修正後：中身だけ切り抜く</h2><div class="card good"><div class="card-face"><div class="banner"></div><div class="copy"><p>角丸はそのまま。顔は箱の外まで見える。</p><a href="#explanation">仕組みを見る</a></div></div><span class="mascot" aria-hidden="true">•ᴗ•</span></div><small><code>.card-face { overflow: hidden; }</code></small></section>
</div><p id="explanation">外側の箱は配置の基準。内側の箱は角丸の切り抜き。飾りは内側の箱の隣に置いています。</p></html>
